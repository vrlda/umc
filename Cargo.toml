[workspace]
resolver = "2"
members = [
    "crates/umc-types",
    "crates/umc-wire",
    "crates/umc-crypto",
    "crates/umc-handshake",
    "crates/umc-session",
    "crates/umc-carrier",
    "carriers/umc-carrier-tcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
