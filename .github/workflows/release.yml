name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render installer and bootstrap manifest
        run: |
          mkdir -p release
          bash scripts/release/render-install.sh "${GITHUB_REPOSITORY}" release/openmesh-install.sh
          cp bootstrap/peers.json release/bootstrap-peers.json
          sha256sum release/openmesh-install.sh | awk '{print $1}' > release/openmesh-install.sh.sha256
          sha256sum release/bootstrap-peers.json | awk '{print $1}' > release/bootstrap-peers.json.sha256

      - name: Upload prepared assets
        uses: actions/upload-artifact@v4
        with:
          name: release-prepare
          path: release/*

  daemon-linux:
    name: Daemon Linux (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build daemon
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p release
          go build -trimpath -o "release/openmeshd-linux-${GOARCH}" ./core/cmd/openmeshd
          sha256sum "release/openmeshd-linux-${GOARCH}" | awk '{print $1}' > "release/openmeshd-linux-${GOARCH}.sha256"

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-${{ matrix.goarch }}
          path: release/*

  desktop-macos:
    name: Desktop macOS DMG
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build macOS daemon
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p release
          go build -trimpath -o release/openmeshd-darwin-arm64 ./core/cmd/openmeshd

      - name: Build macOS desktop app
        working-directory: desktop
        run: flutter build macos --release --dart-define=OPENMESH_BOOTSTRAP_MANIFEST_URLS=https://github.com/${{ github.repository }}/releases/latest/download/bootstrap-peers.json

      - name: Package DMG
        run: |
          bash scripts/release/package-macos-app.sh \
            desktop/build/macos/Build/Products/Release/openmesh_desktop.app \
            release/openmeshd-darwin-arm64 \
            openmesh-desktop-macos-arm64.dmg \
            release
          shasum -a 256 release/openmesh-desktop-macos-arm64.dmg | awk '{print $1}' > release/openmesh-desktop-macos-arm64.dmg.sha256

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: release/openmesh-desktop-macos-arm64.dmg*

  desktop-windows:
    name: Desktop Windows ZIP
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: desktop
        run: flutter pub get

      - name: Build Windows daemon
        shell: bash
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p release
          go build -trimpath -o release/openmeshd.exe ./core/cmd/openmeshd

      - name: Build Windows desktop app
        working-directory: desktop
        run: flutter build windows --release --dart-define=OPENMESH_BOOTSTRAP_MANIFEST_URLS=https://github.com/${{ github.repository }}/releases/latest/download/bootstrap-peers.json

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item release/openmeshd.exe desktop/build/windows/x64/runner/Release/openmeshd.exe
          Compress-Archive -Path desktop/build/windows/x64/runner/Release/* -DestinationPath release/openmesh-desktop-windows-x64.zip -Force
          (Get-FileHash release/openmesh-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content release/openmesh-desktop-windows-x64.zip.sha256 -NoNewline

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: release/openmesh-desktop-windows-x64.zip*

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Go mobile bridge
        run: bash mobile/android/build-openmesh-aar.sh

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: mobile
        env:
          OPENMESH_BOOTSTRAP_MANIFEST_URLS: https://github.com/${{ github.repository }}/releases/latest/download/bootstrap-peers.json
        run: flutter build apk --release

      - name: Package APK
        run: |
          mkdir -p release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release/openmesh-android.apk
          sha256sum release/openmesh-android.apk | awk '{print $1}' > release/openmesh-android.apk.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release/openmesh-android.apk*

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - daemon-linux
      - desktop-macos
      - desktop-windows
      - android
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find release-assets -type f -exec cp {} release/ \;
          ls -la release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
