name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: arduino/setup-protoc@v3
        if: runner.os != 'macOS'
        with:
          version: "28.3"
      - name: Install Linux keychain build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo SBOM metadata
        run: cargo metadata --format-version 1 --locked > sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  independent-vectors:
    name: Independent protocol vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vector verifier dependencies
        run: python -m pip install --disable-pip-version-check -r interop/python/requirements.txt
      - name: Verify published vectors
        run: python -m unittest discover -s interop/python -p 'test_*.py'

  carrier-interoperability:
    name: Independent carrier interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
      - name: Install Linux keychain build dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install interoperability dependencies
        run: python -m pip install --disable-pip-version-check -r interop/python/requirements.txt
      - name: Build daemon
        run: cargo build --locked -p umcd
      - name: Exercise TCP carrier
        run: python interop/python/live_runner.py --carrier tcp --binary target/debug/umcd --result artifacts/tcp.json
      - name: Exercise UDP carrier
        run: python interop/python/live_runner.py --carrier udp --binary target/debug/umcd --result artifacts/udp.json
      - name: Exercise TLS stream carrier
        run: python interop/python/live_runner.py --carrier tls --binary target/debug/umcd --result artifacts/tls.json
      - name: Upload interoperability evidence
        uses: actions/upload-artifact@v4
        with:
          name: carrier-interoperability
          path: artifacts/

  security-evidence:
    name: Security evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
      - name: Install Linux keychain build dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - name: Run security evidence gate
        run: python3 interop/python/security_gate.py --output artifacts/security-report.json
      - name: Upload security evidence
        uses: actions/upload-artifact@v4
        with:
          name: security-evidence
          path: artifacts/security-report.json
