name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Fuzz corpus smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each target against its seed corpus
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in wire_parser relay_frames handshake_encoding bundle_frame control_envelope carrier_framing session_packet identity_binding route_frames plugin_manifest db_recovery; do
            cargo fuzz run "$target" "corpus/$target" --sanitizer none -- -runs=1000
          done

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Nightly fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wire_parser, relay_frames, handshake_encoding, bundle_frame, control_envelope, carrier_framing, session_packet, identity_binding, route_frames, plugin_manifest, db_recovery]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz for ten minutes
        working-directory: fuzz
        run: cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" --sanitizer none -- -max_total_time=600
