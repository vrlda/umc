name: Feature request
description: Propose a scoped improvement to the project.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        For major protocol or governance changes, start with a discussion before writing code.
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: A short title for the proposal
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change at a high level.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: related_area
    attributes:
      label: Related area or component
      placeholder: For example, routing, transport, mobile, or desktop
  - type: textarea
    id: security
    attributes:
      label: Privacy, security, or operator impact
      description: Explain any tradeoffs or new risks.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked for existing issues or discussions
          required: true
        - label: I understand large design changes may need discussion before implementation
          required: true
