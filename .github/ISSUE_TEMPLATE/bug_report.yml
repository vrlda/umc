name: Bug report
description: Report a reproducible problem in OpenMesh.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Do not use this form for security vulnerabilities. Use the private process in `SECURITY.md`.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the problem.
      placeholder: Briefly describe what went wrong
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - architecture
        - transport
        - handshake
        - probe
        - dht
        - routing
        - node selection
        - daemon or cli
        - mobile
        - desktop
        - installer
        - docs
        - ci or release
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Please include exact steps, inputs, or commands when possible.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device, branch, commit, network conditions, or other relevant context.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy or security impact
      description: Mention if the issue could affect metadata exposure, operator safety, or censorship resistance.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, addresses, and personal data before sharing.
